<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alina App</title>
    <style>
        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Centered Login Button --- */
        #main-login-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            /* Start hidden to prevent flickering while we check auth status */
            display: none; 
        }

        #main-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        /* Loading Text */
        #loading-msg {
            color: #666;
            font-size: 1.1rem;
        }

        /* --- Modal/Bottom Sheet Overlay --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: flex;
            opacity: 1;
        }

        /* --- Modal Container --- */
        .modal {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }

        /* --- Close Button --- */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        /* --- Google Sign-In Button Styling --- */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            height: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            color: #3c4043;
        }

        .google-btn:hover {
            background-color: #f7f8f8;
            border-color: #d2e3fc;
        }

        .google-btn img {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        /* --- MOBILE SPECIFIC: Bottom Sheet Logic --- */
        @media (max-width: 768px) {
            .overlay {
                align-items: flex-end; 
            }

            .modal {
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                padding: 30px 20px 50px 20px;
                transform: translateY(100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .overlay.active .modal {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="loading-msg">Checking authentication...</div>

    <button id="main-login-btn">Log In</button>

    <div class="overlay" id="modal-overlay">
        <div class="modal">
            <button class="close-btn" id="close-modal">&times;</button>
            <h2>Welcome Back</h2>
            <p style="color: #666; margin-bottom: 25px;">Sign in to access your account</p>
            
            <button class="google-btn" id="google-signin-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // Added onAuthStateChanged to the import list
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZukFaY1X-MKZziof45k43uKelGBRTlhk",
            authDomain: "alina-b5355.firebaseapp.com",
            projectId: "alina-b5355",
            storageBucket: "alina-b5355.firebasestorage.app",
            messagingSenderId: "926134449790",
            appId: "1:926134449790:web:759652d3fa38199fab4a2f",
            measurementId: "G-DFK1VC9PPS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const mainBtn = document.getElementById('main-login-btn');
        const overlay = document.getElementById('modal-overlay');
        const closeBtn = document.getElementById('close-modal');
        const googleBtn = document.getElementById('google-signin-btn');
        const loadingMsg = document.getElementById('loading-msg');

        // --- AUTH LOGIC ---

        // 1. Check if user is ALREADY logged in (Persistence)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, redirect immediately
                console.log("User already logged in, redirecting...");
                window.location.href = "profile.html";
            } else {
                // User is signed out, show the login button and hide loading text
                loadingMsg.style.display = "none";
                mainBtn.style.display = "block";
            }
        });

        // 2. Handle Login Button Click
        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // Successful login
                    console.log("Login success");
                    // Redirect to profile
                    window.location.href = "profile.html";
                })
                .catch((error) => {
                    console.error("Error", error);
                    alert("Login failed: " + error.message);
                });
        });

        // --- UI LOGIC ---
        mainBtn.addEventListener('click', () => overlay.classList.add('active'));
        
        const closeModal = () => overlay.classList.remove('active');
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });

    </script>
</body>
</html>
