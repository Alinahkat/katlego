<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Adaptive Sheet/Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      /* --- Added Background Image --- */
      background: 
        linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      /* ------------------------------ */
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    /* ------------------- Trigger Button ------------------- */
    .auth-trigger {
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.3);
      transition: all 0.3s ease;
    }

    .auth-trigger:hover {
      background: #0055dd;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 102, 255, 0.4);
    }

    /* ------------------- Bottom Sheet (Mobile) ------------------- */
    .bottom-sheet {
      position: fixed;
      inset: auto 0 0 0;
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 92dvh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .bottom-sheet.active {
      transform: translateY(0);
      display: block;
    }

    .sheet-handle {
      width: 42px;
      height: 5px;
      background: #ddd;
      border-radius: 999px;
      margin: 16px auto;
    }

    /* ------------------- Modal (Desktop) ------------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px); /* Enhanced blur for better focus */
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 900;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* Shared form styles */
    .form-container {
      padding: 2.5rem 2rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.8rem;
      font-size: 1.8rem;
      color: #111;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #444;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 4px rgba(0,102,255,0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #0055dd;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #f0f2f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      color: #777;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .close-btn:hover {
      background: #e4e6eb;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .bottom-sheet {
        display: none !important;
      }
    }

    @media (max-width: 767px) {
      .modal-overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <button class="auth-trigger" id="openAuth">Sign In to Dashboard</button>

  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="form-container">
      <button class="close-btn" id="closeSheet">×</button>
      <h2>Welcome Back</h2>
      
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn">Continue</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">×</button>
      <div class="form-container">
        <h2>Welcome Back</h2>

        <form>
          <div class="form-group">
            <label for="emailDesktop">Email Address</label>
            <input type="email" id="emailDesktop" placeholder="name@company.com" required>
          </div>

          <div class="form-group">
            <label for="passwordDesktop">Password</label>
            <input type="password" id="passwordDesktop" placeholder="••••••••" required>
          </div>

          <button type="submit" class="login-btn">Continue</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openAuth');
    const bottomSheet = document.getElementById('bottomSheet');
    const modal = document.getElementById('modalOverlay');
    const closeSheet = document.getElementById('closeSheet');
    const closeModal = document.getElementById('closeModal');

    function openAuth() {
      if (window.innerWidth < 768) {
        bottomSheet.classList.add('active');
        document.body.style.overflow = 'hidden'; // Prevent scrolling
      } else {
        modal.classList.add('active');
      }
    }

    function closeAuth() {
      bottomSheet.classList.remove('active');
      modal.classList.remove('active');
      document.body.style.overflow = ''; 
    }

    openBtn.addEventListener('click', openAuth);
    closeSheet.addEventListener('click', closeAuth);
    closeModal.addEventListener('click', closeAuth);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeAuth();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAuth();
    });
  </script>
</body>
</html>
