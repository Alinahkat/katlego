<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alina App</title>
    <style>
        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Centered Login Button --- */
        #main-login-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #main-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        /* --- Modal/Bottom Sheet Overlay --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: flex;
            opacity: 1;
        }

        /* --- Modal Container --- */
        .modal {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }

        /* --- Close Button --- */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        /* --- Google Sign-In Button Styling --- */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            height: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            color: #3c4043;
        }

        .google-btn:hover {
            background-color: #f7f8f8;
            border-color: #d2e3fc;
        }

        .google-btn img {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        /* --- MOBILE SPECIFIC: Bottom Sheet Logic --- */
        @media (max-width: 768px) {
            .overlay {
                align-items: flex-end; /* Align to bottom for mobile */
            }

            .modal {
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0; /* Rounded top corners only */
                padding: 30px 20px 50px 20px; /* Extra padding at bottom */
                transform: translateY(100%); /* Start off-screen */
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .overlay.active .modal {
                transform: translateY(0); /* Slide up */
            }
        }
    </style>
</head>
<body>

    <button id="main-login-btn">Log In</button>

    <div class="overlay" id="modal-overlay">
        <div class="modal">
            <button class="close-btn" id="close-modal">&times;</button>
            <h2>Welcome Back</h2>
            <p style="color: #666; margin-bottom: 25px;">Sign in to access your account</p>
            
            <button class="google-btn" id="google-signin-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZukFaY1X-MKZziof45k43uKelGBRTlhk",
            authDomain: "alina-b5355.firebaseapp.com",
            projectId: "alina-b5355",
            storageBucket: "alina-b5355.firebasestorage.app",
            messagingSenderId: "926134449790",
            appId: "1:926134449790:web:759652d3fa38199fab4a2f",
            measurementId: "G-DFK1VC9PPS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const mainBtn = document.getElementById('main-login-btn');
        const overlay = document.getElementById('modal-overlay');
        const closeBtn = document.getElementById('close-modal');
        const googleBtn = document.getElementById('google-signin-btn');

        // --- UI Logic ---

        // Open Modal
        mainBtn.addEventListener('click', () => {
            overlay.classList.add('active');
        });

        // Close Modal
        const closeModal = () => {
            overlay.classList.remove('active');
        };

        closeBtn.addEventListener('click', closeModal);
        
        // Close if clicking outside the modal (on the background)
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closeModal();
            }
        });

        // --- Auth Logic ---

        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // This gives you a Google Access Token.
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;

                    console.log("User signed in:", user);
                    alert(`Hello, ${user.displayName}! You are logged in.`);
                    closeModal();
                    
                    // Optional: Hide login button or redirect here
                    mainBtn.textContent = "Logged In";
                    mainBtn.disabled = true;
                })
                .catch((error) => {
                    // Handle Errors here.
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Error during sign in:", errorCode, errorMessage);
                    alert("Login failed: " + errorMessage);
                });
        });
    </script>
</body>
</html>
