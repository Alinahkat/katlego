<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - Google</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    .auth-trigger {
      padding: 16px 44px;
      font-size: 1.15rem;
      font-weight: 600;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.3);
      transition: all 0.3s ease;
    }

    .auth-trigger:hover {
      background: #0055dd;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 102, 255, 0.4);
    }

    /* Bottom Sheet (Mobile) */
    .bottom-sheet {
      position: fixed;
      inset: auto 0 0 0;
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.28);
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 90dvh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .bottom-sheet.active {
      transform: translateY(0);
      display: block;
    }

    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #ccc;
      border-radius: 999px;
      margin: 18px auto;
    }

    /* Modal (Desktop) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s ease;
      z-index: 900;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -10px rgba(0,0,0,0.5);
      transform: scale(0.92);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* Common content styles */
    .auth-container {
      padding: 3rem 2.5rem;
      text-align: center;
    }

    h2 {
      font-size: 1.9rem;
      margin-bottom: 0.8rem;
      color: #111;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    p.subtitle {
      color: #555;
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      padding: 14px 24px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .google-btn:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transform: translateY(-1px);
    }

    .google-btn img {
      width: 24px;
      height: 24px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #f1f3f5;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.4rem;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #e5e7eb;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .bottom-sheet { display: none !important; }
    }

    @media (max-width: 767px) {
      .modal-overlay { display: none !important; }
    }
  </style>
</head>
<body>

  <button class="auth-trigger" id="openAuth">Sign In with Google</button>

  <!-- Mobile Bottom Sheet -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="auth-container">
      <button class="close-btn" id="closeSheet">×</button>
      <h2>Welcome</h2>
      <p class="subtitle">Sign in to continue to your dashboard</p>

      <button class="google-btn" type="button">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- Desktop Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">×</button>
      <div class="auth-container">
        <h2>Sign In</h2>
        <p class="subtitle">Use your Google account to continue</p>

        <button class="google-btn" type="button">
          <img src="https://www.google.com/favicon.ico" alt="Google">
          Continue with Google
        </button>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openAuth');
    const bottomSheet = document.getElementById('bottomSheet');
    const modal = document.getElementById('modalOverlay');
    const closeSheet = document.getElementById('closeSheet');
    const closeModal = document.getElementById('closeModal');

    function openAuth() {
      if (window.innerWidth < 768) {
        bottomSheet.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        modal.classList.add('active');
      }
    }

    function closeAuth() {
      bottomSheet.classList.remove('active');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    openBtn.addEventListener('click', openAuth);
    closeSheet.addEventListener('click', closeAuth);
    closeModal.addEventListener('click', closeAuth);
    
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeAuth();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAuth();
    });
  </script>
</body>
</html>
