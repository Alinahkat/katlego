<div id="customModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div class="card" style="max-width:400px; width:90%; text-align:center; padding:2rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);">
    <div id="modalIcon" style="margin-bottom:1rem;"></div>
    <h3 id="modalTitle" style="margin-top:0;">Action</h3>
    <p id="modalMsg" style="color:var(--gray); margin-bottom:1.5rem;"></p>
    <div style="display:flex; gap:10px; justify-content:center;" id="modalActions">
      </div>
  </div>
</div>

<script type="module">
  // ... (Keep existing imports)

  // --- ADDED MODAL UTILITY ---
  const modal = document.getElementById('customModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const modalActions = document.getElementById('modalActions');
  const modalIcon = document.getElementById('modalIcon');

  function openModal({title, message, icon, type, onConfirm}) {
    modalTitle.innerText = title;
    modalMsg.innerText = message;
    modalIcon.innerHTML = `<i data-lucide="${icon}" style="width:48px; height:48px; color:${type === 'danger' ? 'var(--danger)' : 'var(--success)'}"></i>`;
    modalActions.innerHTML = '';
    
    if (onConfirm) {
      // Confirmation Mode
      const cancelBtn = document.createElement('button');
      cancelBtn.innerText = 'Cancel';
      cancelBtn.style.background = '#e2e8f0';
      cancelBtn.style.color = 'var(--text-main)';
      cancelBtn.onclick = () => modal.style.display = 'none';
      
      const confirmBtn = document.createElement('button');
      confirmBtn.innerText = 'Yes, Proceed';
      confirmBtn.className = 'danger';
      confirmBtn.onclick = () => { onConfirm(); modal.style.display = 'none'; };
      
      modalActions.appendChild(cancelBtn);
      modalActions.appendChild(confirmBtn);
    } else {
      // Success Notification Mode
      const okBtn = document.createElement('button');
      okBtn.innerText = 'Continue';
      okBtn.className = 'success';
      okBtn.style.width = '100%';
      okBtn.onclick = () => modal.style.display = 'none';
      modalActions.appendChild(okBtn);
    }
    
    modal.style.display = 'flex';
    lucide.createIcons();
  }

  // --- UPDATED ENROLLMENT LOGIC ---
  document.getElementById('provisionBtn').onclick = async () => {
    const email = document.getElementById('newLearnerEmail').value;
    const qual = document.getElementById('qualSelect').value;
    const subjects = document.getElementById('learnerSubjects').value;
    if(email && qual) {
        await push(ref(db, 'learners'), {
          email, 
          assignedQual: qual, 
          subjects, 
          status: 'pending', // Added pending status
          timestamp: serverTimestamp()
        });
        
        // Show Modern Modal
        openModal({
          title: 'Enrollment Successful',
          message: `${email} has been added to the course system.`,
          icon: 'check-circle'
        });

        document.getElementById('newLearnerEmail').value = '';
        document.getElementById('qualSelect').value = '';
        document.getElementById('learnerSubjects').value = '';
    } else { showToast("Email and Course are required", "#ef4444"); }
  };

  // --- UPDATED REMOVAL LOGIC ---
  window.deleteLearnerConfirm = key => {
    openModal({
      title: 'Confirm Removal',
      message: 'Are you sure you want to remove this learner? This will permanently delete their record.',
      icon: 'alert-triangle',
      type: 'danger',
      onConfirm: () => {
        remove(ref(db, 'learners/' + key));
        showToast("Learner removed from directory", "#f59e0b");
      }
    });
  };

  // --- UPDATED DIRECTORY UI (To show Pending/Active) ---
  onValue(ref(db, 'learners'), snap => {
    document.getElementById('stat-enrollment').innerText = snap.size || 0;
    const list = document.getElementById('directoryList'); list.innerHTML = '';
    snap.forEach(c => {
      const data = c.val();
      // Logic: If they have logged in (lastLogin exists), they are active, otherwise pending
      const statusText = data.lastLogin ? 'Active' : 'Pending';
      const statusColor = data.lastLogin ? 'var(--success)' : 'var(--warning)';

      list.innerHTML += `<tr>
        <td>${data.email}</td>
        <td>${data.assignedQual}</td>
        <td><span style="font-size:10px; font-weight:800; color:${statusColor}; border:1px solid ${statusColor}; padding:2px 6px; border-radius:4px; text-transform:uppercase;">${statusText}</span></td>
        <td><button class="danger" onclick="deleteLearnerConfirm('${c.key}')">Remove</button></td>
      </tr>`;
    });
  });

  // ... (Keep the rest of your logic exactly the same)
</script>
