<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Adaptive Sheet/Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    /* ------------------- Trigger Button ------------------- */
    .auth-trigger {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-trigger:hover {
      background: #0055dd;
      transform: translateY(-1px);
    }

    /* ------------------- Bottom Sheet (Mobile) ------------------- */
    .bottom-sheet {
      position: fixed;
      inset: auto 0 0 0;
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 92dvh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .bottom-sheet.active {
      transform: translateY(0);
      display: block;
    }

    .sheet-handle {
      width: 42px;
      height: 5px;
      background: #ddd;
      border-radius: 999px;
      margin: 16px auto;
    }

    /* ------------------- Modal (Desktop) ------------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 900;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,0.3);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    /* Shared form styles */
    .form-container {
      padding: 2.5rem 2rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.8rem;
      font-size: 1.8rem;
      color: #111;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #444;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0,102,255,0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #0055dd;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #777;
      cursor: pointer;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .bottom-sheet {
        display: none !important;
      }
    }

    @media (max-width: 767px) {
      .modal-overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- When NOT logged in - this is shown -->
  <button class="auth-trigger" id="openAuth">Login</button>

  <!-- Mobile Bottom Sheet -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="form-container">
      <h2>Welcome</h2>
      <button class="close-btn" id="closeSheet">×</button>

      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="hello@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Desktop Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">×</button>
      <div class="form-container">
        <h2>Sign In</h2>

        <form>
          <div class="form-group">
            <label for="emailDesktop">Email</label>
            <input type="email" id="emailDesktop" placeholder="hello@example.com" required>
          </div>

          <div class="form-group">
            <label for="passwordDesktop">Password</label>
            <input type="password" id="passwordDesktop" placeholder="••••••••" required>
          </div>

          <button type="submit" class="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openAuth');
    const bottomSheet = document.getElementById('bottomSheet');
    const modal = document.getElementById('modalOverlay');
    const closeSheet = document.getElementById('closeSheet');
    const closeModal = document.getElementById('closeModal');

    function openAuth() {
      if (window.innerWidth < 768) {
        bottomSheet.classList.add('active');
      } else {
        modal.classList.add('active');
      }
    }

    function closeAuth() {
      bottomSheet.classList.remove('active');
      modal.classList.remove('active');
    }

    openBtn.addEventListener('click', openAuth);
    closeSheet.addEventListener('click', closeAuth);
    closeModal.addEventListener('click', closeAuth);

    // Close modal/sheet when clicking outside content
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeAuth();
    });

    // Optional: close on ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAuth();
    });
  </script>
</body>
</html>
