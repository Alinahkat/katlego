<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - Google</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- jwt-decode library for client-side decoding -->
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }
    .auth-trigger {
      padding: 16px 44px;
      font-size: 1.15rem;
      font-weight: 600;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.3);
      transition: all 0.3s ease;
    }
    .auth-trigger:hover {
      background: #0055dd;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 102, 255, 0.4);
    }
    .bottom-sheet {
      position: fixed;
      inset: auto 0 0 0;
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.28);
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 90dvh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .bottom-sheet.active { transform: translateY(0); display: block; }
    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #ccc;
      border-radius: 999px;
      margin: 18px auto;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s ease;
      z-index: 900;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -10px rgba(0,0,0,0.5);
      transform: scale(0.92);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .auth-container {
      padding: 3rem 2.5rem;
      text-align: center;
    }
    h2 { font-size: 1.9rem; margin-bottom: 0.8rem; color: #111; font-weight: 700; }
    p.subtitle { color: #555; margin-bottom: 2.5rem; font-size: 1.05rem; }
    .g_id_signin { margin: 0 auto; }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #f1f3f5;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.4rem;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #e5e7eb; }
    @media (min-width: 768px) { .bottom-sheet { display: none !important; } }
    @media (max-width: 767px) { .modal-overlay { display: none !important; } }
  </style>
</head>
<body>

  <button class="auth-trigger" id="openAuth">Sign In with Google</button>

  <!-- Mobile Bottom Sheet -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="auth-container">
      <button class="close-btn" id="closeSheet">×</button>
      <h2>Welcome</h2>
      <p class="subtitle">Sign in to continue to your dashboard</p>

      <!-- Google Sign In Button - Popup mode -->
      <div id="g_id_onload"
           data-client_id="YOUR_WEB_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="continue_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>
  </div>

  <!-- Desktop Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">×</button>
      <div class="auth-container">
        <h2>Sign In</h2>
        <p class="subtitle">Use your Google account to continue</p>

        <!-- Same Google Sign In Button -->
        <div id="g_id_onload"
             data-client_id="YOUR_WEB_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="continue_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
      </div>
    </div>
  </div>

  <script>
    // Replace with your real Client ID!
    const CLIENT_ID = "YOUR_WEB_CLIENT_ID.apps.googleusercontent.com";

    // Callback function when user signs in (popup mode)
    function handleCredentialResponse(response) {
      try {
        const idToken = response.credential;
        const payload = jwt_decode(idToken);  // Decode JWT

        // You can now redirect or show profile content
        alert(`Welcome, ${payload.name}!\nEmail: ${payload.email}`);

        // Optional: redirect to a profile page with query params (not secure for production!)
         window.location.href = `profile.html?name=${encodeURIComponent(payload.name)}&email=${encodeURIComponent(payload.email)}&picture=${encodeURIComponent(payload.picture)}`;

        // For production → send idToken to your backend via fetch/AJAX
      } catch (error) {
        console.error("Error decoding token:", error);
      }
    }

    const openBtn = document.getElementById('openAuth');
    const bottomSheet = document.getElementById('bottomSheet');
    const modal = document.getElementById('modalOverlay');
    const closeSheet = document.getElementById('closeSheet');
    const closeModal = document.getElementById('closeModal');

    function openAuth() {
      if (window.innerWidth < 768) {
        bottomSheet.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        modal.classList.add('active');
      }
    }

    function closeAuth() {
      bottomSheet.classList.remove('active');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    openBtn.addEventListener('click', openAuth);
    closeSheet.addEventListener('click', closeAuth);
    closeModal.addEventListener('click', closeAuth);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeAuth(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAuth(); });
  </script>
</body>
</html>
