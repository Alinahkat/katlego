  async function handleGoogleSignIn(response) {
    try {
      const credential = window.firebaseApp.GoogleAuthProvider.credential(response.credential);
      const result = await window.firebaseApp.signInWithCredential(window.firebaseApp.auth, credential);
      showProfile(result.user);
    } catch (error) {
      console.error("Sign-in failed:", error);
      alert("Google sign-in failed. Please try again.");
    }
  }
