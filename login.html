<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                  url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000');
      background-size: cover;
      background-attachment: fixed;
      color: white;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .profile-card {
      background: rgba(255,255,255,0.95);
      color: #111;
      padding: 3rem;
      border-radius: 16px;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    img { border-radius: 50%; width: 120px; height: 120px; object-fit: cover; margin-bottom: 1.5rem; }
    h1 { margin-bottom: 0.5rem; }
    p { margin: 0.5rem 0; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="profile-card">
    <img id="profilePic" src="" alt="Profile" />
    <h1 id="name">Welcome!</h1>
    <p id="email"></p>
    <p><small>Signed in with Google</small></p>
  </div>

  <script>
    // This runs when redirected back from Google
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: "YOUR_WEB_CLIENT_ID.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      // Try to get credential from redirect (GSI handles it automatically in redirect mode)
      google.accounts.id.prompt(); // optional — shows One Tap if needed
    };

    function handleCredentialResponse(response) {
      // response.credential is the JWT ID token
      const data = JSON.parse(atob(response.credential.split('.')[1])); // decode payload

      document.getElementById('name').textContent = data.name || "User";
      document.getElementById('email').textContent = data.email || "No email";
      document.getElementById('profilePic').src = data.picture || "https://via.placeholder.com/120";
    }
  </script>
</body>
</html>
